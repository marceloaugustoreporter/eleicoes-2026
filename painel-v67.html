<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Atualizando Central de Apuração</title>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) await reg.update();
    }
  }catch(e){}
  const p = new URLSearchParams(location.search);
  p.delete('_t');
  p.set('v','68');
  p.set('_t',Date.now());
  location.replace('painel-v68.html?'+p.toString()+location.hash);
})();
</script>
</head>
<body style="margin:0;background:#06101a;color:#fff;font-family:system-ui;padding:24px">
Atualizando a Central de Apuração…
</body>
</html>
