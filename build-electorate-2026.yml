name: Gerar Cadastro Eleitoral 2026

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electorate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar base oficial do TSE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-electorate
          curl --fail --location --retry 4 --retry-delay 5 \
            --output .tmp-electorate/perfil_eleitorado_2026.zip \
            "https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_eleitorado/perfil_eleitorado_2026.zip"
          ls -lh .tmp-electorate/perfil_eleitorado_2026.zip

      - name: Reduzir a base por município
        shell: python
        run: |
          import csv
          import io
          import json
          import shutil
          import zipfile
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          ZIP_PATH = Path(".tmp-electorate/perfil_eleitorado_2026.zip")
          OUT_DIR = Path("v7/data/electorate_2026")

          UFS = [
              "AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG",
              "PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"
          ]
          UF_SET = set(UFS)

          required = {"SG_UF", "CD_MUNICIPIO", "NM_MUNICIPIO"}
          selected_csv = None
          selected_voters_col = None

          # Escolhe apenas UM CSV nacional compatível.
          # O ZIP pode conter mais de um CSV com estrutura semelhante.
          with zipfile.ZipFile(ZIP_PATH) as zf:
              candidates = sorted(
                  [n for n in zf.namelist() if n.lower().endswith(".csv")],
                  key=lambda n: zf.getinfo(n).file_size,
                  reverse=True
              )

              if not candidates:
                  raise RuntimeError("Nenhum CSV encontrado no ZIP do TSE.")

              print(f"{len(candidates)} CSV(s) encontrado(s) no ZIP.")

              for csv_name in candidates:
                  with zf.open(csv_name, "r") as raw:
                      text = io.TextIOWrapper(raw, encoding="latin-1", newline="")
                      reader = csv.reader(text, delimiter=";")
                      try:
                          header = next(reader)
                      except StopIteration:
                          continue

                  header = [(h or "").lstrip("\ufeff").strip() for h in header]
                  fields = set(header)

                  if not required.issubset(fields):
                      continue

