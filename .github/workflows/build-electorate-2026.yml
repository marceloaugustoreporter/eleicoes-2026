name: Gerar Cadastro Eleitoral 2026

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electorate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar base oficial do TSE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-electorate
          curl --fail --location --retry 4 --retry-delay 5 \
            --output .tmp-electorate/perfil_eleitorado_2026.zip \
            "https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_eleitorado/perfil_eleitorado_2026.zip"
          ls -lh .tmp-electorate/perfil_eleitorado_2026.zip

      - name: Reduzir a base por município
        shell: python
        run: |
          import csv
          import io
          import json
          import zipfile
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          ZIP_PATH = Path(".tmp-electorate/perfil_eleitorado_2026.zip")
          OUT_DIR = Path("v7/data/electorate_2026")

          UFS = [
              "AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG",
              "PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"
          ]
          UF_SET = set(UFS)

          OUT_DIR.mkdir(parents=True, exist_ok=True)

          totals = defaultdict(int)
          names = {}
          reference_date = None
          source_rows = 0
          data_csv_count = 0

          with zipfile.ZipFile(ZIP_PATH) as zf:
              csv_files = [n for n in zf.namelist() if n.lower().endswith(".csv")]
              if not csv_files:
                  raise RuntimeError("Nenhum CSV encontrado no ZIP do TSE.")

              print(f"{len(csv_files)} arquivo(s) CSV encontrado(s) no ZIP.")

              for csv_name in csv_files:
                  print(f"Lendo: {csv_name}")
                  with zf.open(csv_name, "r") as raw:
                      text = io.TextIOWrapper(raw, encoding="latin-1", newline="")
                      reader = csv.DictReader(text, delimiter=";")

                      if reader.fieldnames:
                          reader.fieldnames = [
                              (f or "").lstrip("\ufeff").strip()
                              for f in reader.fieldnames
                          ]

                      required = {"SG_UF", "CD_MUNICIPIO", "NM_MUNICIPIO"}
                      fields = set(reader.fieldnames or [])
                      if not required.issubset(fields):
                          print(f"Ignorado: {csv_name} não contém as colunas municipais esperadas.")
                          continue

                      voters_col = None
                      for candidate in ("QT_ELEITORES_PERFIL", "QT_ELEITORES"):
                          if candidate in fields:
                              voters_col = candidate
                              break
                      if not voters_col:
                          print(f"Ignorado: {csv_name} não contém coluna de quantidade de eleitores.")
                          continue

                      data_csv_count += 1

                      for row in reader:
                          source_rows += 1
                          uf = (row.get("SG_UF") or "").strip().upper()
                          if uf not in UF_SET:
                              continue

                          code = "".join(
                              ch for ch in (row.get("CD_MUNICIPIO") or "")
                              if ch.isdigit()
                          ).zfill(5)
                          if not code.strip("0"):
                              continue

                          name = (row.get("NM_MUNICIPIO") or "").strip()
                          raw_voters = "".join(
                              ch for ch in (row.get(voters_col) or "0")
                              if ch.isdigit()
                          )
                          voters = int(raw_voters or 0)

                          key = (uf, code)
                          totals[key] += voters
                          if name:
                              names[key] = name

                          if not reference_date:
                              dt = (row.get("DT_GERACAO") or "").strip()
                              if dt:
                                  reference_date = dt

          if not data_csv_count:
              raise RuntimeError("Nenhum CSV de dados compatível foi encontrado.")

          generated_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          state_meta = {}
          national_total = 0
          national_municipalities = 0

          for uf in UFS:
              items = []
              for (row_uf, code), voters in totals.items():
                  if row_uf != uf or voters <= 0:
                      continue
                  items.append({
                      "code": code,
                      "name": names.get((row_uf, code), ""),
                      "voters": voters
                  })

              items.sort(key=lambda x: x["name"])
              state_total = sum(x["voters"] for x in items)
              national_total += state_total
              national_municipalities += len(items)

              payload = {
                  "version": "2026.1",
                  "source": "Tribunal Superior Eleitoral",
                  "source_url": "https://dadosabertos.tse.jus.br/dataset/eleitorado-2026",
                  "reference_date": reference_date,
                  "generated_at": generated_at,
                  "uf": uf,
                  "municipalities": len(items),
                  "voters": state_total,
                  "items": items
              }

              (OUT_DIR / f"{uf.lower()}.json").write_text(
                  json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8"
              )

              state_meta[uf] = {
                  "municipalities": len(items),
                  "voters": state_total,
                  "file": f"{uf.lower()}.json"
              }

              print(f"{uf}: {len(items)} municípios | {state_total:,} eleitores")

          index = {
              "version": "2026.1",
              "source": "Tribunal Superior Eleitoral",
              "source_url": "https://dadosabertos.tse.jus.br/dataset/eleitorado-2026",
              "reference_date": reference_date,
              "generated_at": generated_at,
              "source_rows_read": source_rows,
              "municipalities": national_municipalities,
              "voters_27_ufs": national_total,
              "states": state_meta
          }

          (OUT_DIR / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          # Barreiras de segurança: não grava uma base claramente incompleta.
          if national_municipalities < 5500:
              raise RuntimeError(
                  f"Base incompleta: apenas {national_municipalities} municípios encontrados."
              )
          if state_meta["SP"]["municipalities"] < 640:
              raise RuntimeError(
                  f"Base de SP parece incompleta: {state_meta['SP']['municipalities']} municípios."
              )
          if state_meta["MG"]["municipalities"] < 850:
              raise RuntimeError(
                  f"Base de MG parece incompleta: {state_meta['MG']['municipalities']} municípios."
              )

          sp_items = json.loads(
              (OUT_DIR / "sp.json").read_text(encoding="utf-8")
          )["items"]
          mg_items = json.loads(
              (OUT_DIR / "mg.json").read_text(encoding="utf-8")
          )["items"]

          franca = next(
              (x for x in sp_items if x["name"].upper() == "FRANCA"),
              None
          )
          passos = next(
              (x for x in mg_items if x["name"].upper() == "PASSOS"),
              None
          )

          print("Validação Passos:", passos)
          print("Validação Franca:", franca)

          if not passos or not franca:
              raise RuntimeError("Passos ou Franca não foram encontrados na base reduzida.")

      - name: Mostrar arquivos gerados
        shell: bash
        run: |
          du -h v7/data/electorate_2026
          ls -lh v7/data/electorate_2026 | head -40

      - name: Guardar cópia como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cadastro-eleitoral-2026
          path: v7/data/electorate_2026
          retention-days: 30

      - name: Salvar base compacta no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v7/data/electorate_2026

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para gravar."
            exit 0
          fi

          git commit -m "Gerar base municipal do Cadastro Eleitoral 2026"
          git push origin HEAD:main
