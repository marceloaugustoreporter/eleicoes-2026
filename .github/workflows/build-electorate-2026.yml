name: Gerar Cadastro Eleitoral 2026

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electorate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar base oficial do TSE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-electorate
          curl --fail --location --retry 4 --retry-delay 5 \
            --output .tmp-electorate/perfil_eleitorado_2026.zip \
            "https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_eleitorado/perfil_eleitorado_2026.zip"
          ls -lh .tmp-electorate/perfil_eleitorado_2026.zip

      - name: Reduzir a base por município
        shell: python
        run: |
          import csv
          import io
          import json
          import shutil
          import zipfile
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          ZIP_PATH = Path(".tmp-electorate/perfil_eleitorado_2026.zip")
          OUT_DIR = Path("v7/data/electorate_2026")

          UFS = [
              "AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG",
              "PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"
          ]
          UF_SET = set(UFS)

          required = {"SG_UF", "CD_MUNICIPIO", "NM_MUNICIPIO"}
          selected_csv = None
          selected_voters_col = None

          # Escolhe apenas UM CSV nacional compatível.
          # O ZIP pode conter mais de um CSV com estrutura semelhante.
          with zipfile.ZipFile(ZIP_PATH) as zf:
              candidates = sorted(
                  [n for n in zf.namelist() if n.lower().endswith(".csv")],
                  key=lambda n: zf.getinfo(n).file_size,
                  reverse=True
              )

              if not candidates:
                  raise RuntimeError("Nenhum CSV encontrado no ZIP do TSE.")

              print(f"{len(candidates)} CSV(s) encontrado(s) no ZIP.")

              for csv_name in candidates:
                  with zf.open(csv_name, "r") as raw:
                      text = io.TextIOWrapper(raw, encoding="latin-1", newline="")
                      reader = csv.reader(text, delimiter=";")
                      try:
                          header = next(reader)
                      except StopIteration:
                          continue

                  header = [(h or "").lstrip("\ufeff").strip() for h in header]
                  fields = set(header)

                  if not required.issubset(fields):
                      continue

                  voters_col = None
                  for candidate in ("QT_ELEITORES_PERFIL", "QT_ELEITORES"):
                      if candidate in fields:
                          voters_col = candidate
                          break

                  if not voters_col:
                      continue

                  selected_csv = csv_name
                  selected_voters_col = voters_col
                  break

              if not selected_csv:
                  raise RuntimeError("Nenhum CSV municipal compatível foi encontrado no ZIP.")

              info = zf.getinfo(selected_csv)
              print(f"CSV selecionado: {selected_csv}")
              print(f"Tamanho descompactado: {info.file_size:,} bytes")
              print(f"Coluna de eleitorado: {selected_voters_col}")

              totals = defaultdict(int)
              names = {}
              reference_date = None
              source_rows = 0

              with zf.open(selected_csv, "r") as raw:
                  text = io.TextIOWrapper(raw, encoding="latin-1", newline="")
                  reader = csv.DictReader(text, delimiter=";")

                  if reader.fieldnames:
                      reader.fieldnames = [
                          (f or "").lstrip("\ufeff").strip()
                          for f in reader.fieldnames
                      ]

                  for row in reader:
                      source_rows += 1

                      uf = (row.get("SG_UF") or "").strip().upper()
                      if uf not in UF_SET:
                          continue

                      code = "".join(
                          ch for ch in (row.get("CD_MUNICIPIO") or "")
                          if ch.isdigit()
                      ).zfill(5)

                      if not code.strip("0"):
                          continue

                      name = (row.get("NM_MUNICIPIO") or "").strip()

                      raw_voters = "".join(
                          ch for ch in (row.get(selected_voters_col) or "0")
                          if ch.isdigit()
                      )
                      voters = int(raw_voters or 0)

                      key = (uf, code)
                      totals[key] += voters

                      if name:
                          names[key] = name

                      if not reference_date:
                          dt = (row.get("DT_GERACAO") or "").strip()
                          if dt:
                              reference_date = dt

          generated_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          state_payloads = {}
          state_meta = {}
          national_total = 0
          national_municipalities = 0

          for uf in UFS:
              items = []

              for (row_uf, code), voters in totals.items():
                  if row_uf != uf or voters <= 0:
                      continue

                  items.append({
                      "code": code,
                      "name": names.get((row_uf, code), ""),
                      "voters": voters
                  })

              items.sort(key=lambda x: x["name"])
              state_total = sum(x["voters"] for x in items)

              national_total += state_total
              national_municipalities += len(items)

              state_payloads[uf] = {
                  "version": "2026.2",
                  "source": "Tribunal Superior Eleitoral",
                  "source_url": "https://dadosabertos.tse.jus.br/dataset/eleitorado-2026",
                  "reference_date": reference_date,
                  "generated_at": generated_at,
                  "uf": uf,
                  "municipalities": len(items),
                  "voters": state_total,
                  "items": items
              }

              state_meta[uf] = {
                  "municipalities": len(items),
                  "voters": state_total,
                  "file": f"{uf.lower()}.json"
              }

          # Validação ANTES de substituir os arquivos existentes.
          if national_municipalities != 5571:
              raise RuntimeError(
                  f"Quantidade inesperada de municípios: {national_municipalities}."
              )

          if not 150_000_000 <= national_total <= 165_000_000:
              raise RuntimeError(
                  f"Total nacional fora da faixa esperada: {national_total:,}."
              )

          if state_meta["MG"]["municipalities"] != 853:
              raise RuntimeError(
                  f"MG com quantidade inesperada de municípios: "
                  f"{state_meta['MG']['municipalities']}."
              )

          if state_meta["SP"]["municipalities"] != 645:
              raise RuntimeError(
                  f"SP com quantidade inesperada de municípios: "
                  f"{state_meta['SP']['municipalities']}."
              )

          passos = next(
              (x for x in state_payloads["MG"]["items"]
               if x["name"].upper() == "PASSOS"),
              None
          )

          franca = next(
              (x for x in state_payloads["SP"]["items"]
               if x["name"].upper() == "FRANCA"),
              None
          )

          if not passos:
              raise RuntimeError("Passos não foi encontrado na base.")
          if not franca:
              raise RuntimeError("Franca não foi encontrada na base.")

          if passos["voters"] != 81252:
              raise RuntimeError(
                  f"Validação de Passos falhou: "
                  f"esperado 81.252, obtido {passos['voters']:,}."
              )

          print(f"Referência TSE: {reference_date}")
          print(f"Linhas lidas: {source_rows:,}")
          print(f"Municípios: {national_municipalities:,}")
          print(f"Eleitorado nacional da base: {national_total:,}")
          print(f"Passos/MG: {passos['voters']:,}")
          print(f"Franca/SP: {franca['voters']:,}")
          print(f"Minas Gerais: {state_meta['MG']['voters']:,}")
          print(f"São Paulo: {state_meta['SP']['voters']:,}")

          # Só agora substitui a base anterior.
          if OUT_DIR.exists():
              shutil.rmtree(OUT_DIR)
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          for uf in UFS:
              (OUT_DIR / f"{uf.lower()}.json").write_text(
                  json.dumps(
                      state_payloads[uf],
                      ensure_ascii=False,
                      separators=(",", ":")
                  ),
                  encoding="utf-8"
              )

          index = {
              "version": "2026.2",
              "source": "Tribunal Superior Eleitoral",
              "source_url": "https://dadosabertos.tse.jus.br/dataset/eleitorado-2026",
              "reference_date": reference_date,
              "generated_at": generated_at,
              "selected_csv": selected_csv,
              "source_rows_read": source_rows,
              "municipalities": national_municipalities,
              "voters_27_ufs": national_total,
              "states": state_meta
          }

          (OUT_DIR / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

      - name: Mostrar arquivos gerados
        shell: bash
        run: |
          du -h v7/data/electorate_2026
          ls -lh v7/data/electorate_2026 | head -40

      - name: Guardar cópia como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cadastro-eleitoral-2026
          path: v7/data/electorate_2026
          retention-days: 30

      - name: Salvar base compacta no repositório
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v7/data/electorate_2026

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para gravar."
            exit 0
          fi

          git commit -m "Corrigir base municipal do Cadastro Eleitoral 2026"
          git push origin HEAD:main
